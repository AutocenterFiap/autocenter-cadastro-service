services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cadastro_db
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  cadastro-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: cadastro-service:compose
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8097:8097"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/cadastro_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      SISTEMA_SEGURANCA_CHAVE_SECRETA: ${SISTEMA_SEGURANCA_CHAVE_SECRETA:?defina SISTEMA_SEGURANCA_CHAVE_SECRETA}
