apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cadastro-service
  namespace: autocenter
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /v1/clientes
            pathType: Prefix
            backend:
              service: {name: cadastro-service, port: {number: 8097}}
          - path: /v1/veiculos
            pathType: Prefix
            backend:
              service: {name: cadastro-service, port: {number: 8097}}
          - path: /v1/servicos
            pathType: Prefix
            backend:
              service: {name: cadastro-service, port: {number: 8097}}
          - path: /v1/produtos
            pathType: Prefix
            backend:
              service: {name: cadastro-service, port: {number: 8097}}
