apiVersion: v1
kind: ConfigMap
metadata:
  name: cadastro-service-config
  namespace: autocenter
data:
  DB_URL: "jdbc:mysql://cadastro-mysql:3306/cadastro_db?useSSL=false&allowPublicKeyRetrieval=true"
  DD_TRACE_ENABLED: "false"
  DD_INSTRUMENTATION_TELEMETRY_ENABLED: "false"
  DD_ENV: "prod"
  DD_SERVICE: "cadastro-service"
  DD_VERSION: "1.0.0"
  DD_LOGS_INJECTION: "true"
  JAVA_OPTS: "-javaagent:/app/dd-java-agent.jar -XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError"
